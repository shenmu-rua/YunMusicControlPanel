[server]
; ts3audiobot API 地址
api_url = http://localhost:58913

[netease]
; 网易云音乐 API 地址
api_url = http://localhost:3000

[ui]
; 状态轮询间隔（毫秒）
poll_interval_ms = 2000
; 窗口位置（-1 表示自动）
window_x = -1
window_y = -1
; 是否置顶
always_on_top = 0

[update]
; 版本检查 URL（GitHub Releases API）
url = https://api.github.com/repos/shenmu-rua/YunMusicControlPanel/releases/latest
